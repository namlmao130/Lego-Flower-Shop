[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["venv", ".agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy overloads equality to generate SQL; Python `not` is not equivalent.
"app/routes/admin_chat.py" = ["E712"]
"tests/test_app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
