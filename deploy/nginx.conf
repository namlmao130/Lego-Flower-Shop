# ============================================================
# Cấu hình Nginx cho Lego Flower Shop
# (Chỉ cần nếu tự quản lý VPS. Render/Railway/Heroku có reverse proxy
#  + CDN riêng của họ, KHÔNG cần file này.)
#
# Ý TƯỞNG CHÍNH — vì sao cần Nginx đứng trước Gunicorn:
#   - Ảnh sản phẩm (thư mục static/uploads, ~300+ file) nếu để Python/Gunicorn
#     tự phục vụ thì MỖI request ảnh cũng chiếm 1 worker/thread như phục vụ trang
#     động -> lãng phí, vì phục vụ file tĩnh Nginx nhanh hơn Python hàng chục lần.
#   - Nginx có thể nén gzip, cache, giới hạn kết nối... ở lớp ngoài TRƯỚC khi
#     request chạm vào Python, giảm tải cho Gunicorn đáng kể khi nhiều người
#     truy cập cùng lúc.
#
# CÀI ĐẶT:
#   1. Sửa "server_name" thành tên miền thật của bạn
#   2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/legoflower
#   3. sudo ln -s /etc/nginx/sites-available/legoflower /etc/nginx/sites-enabled/
#   4. sudo nginx -t      (kiểm tra cú pháp trước khi áp dụng)
#   5. sudo systemctl reload nginx
#
# Muốn có HTTPS miễn phí: cài thêm Certbot rồi chạy
#   sudo certbot --nginx -d tenmien-cua-ban.com
# (Certbot sẽ tự thêm block "listen 443 ssl" vào file này, không cần tự sửa tay)
# ============================================================

upstream legoflower_app {
    server unix:/run/legoflower/legoflower.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name tenmien-cua-ban.com www.tenmien-cua-ban.com;

    client_max_body_size 15M;   # cho phép upload ảnh sản phẩm/avatar tới 15MB

    # Nén gzip ở tầng Nginx (nhanh hơn để Flask-Compress làm trong Python)
    gzip on;
    gzip_types text/css application/javascript application/json text/html;
    gzip_min_length 1024;

    # ---- PHỤC VỤ TRỰC TIẾP FILE TĨNH — KHÔNG đi qua Python/Gunicorn ----
    location /static/ {
        alias /var/www/lego-flower-shop/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ---- MỌI REQUEST CÒN LẠI (trang động, API, chat...) -> chuyển cho Gunicorn ----
    location / {
        proxy_pass http://legoflower_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Quan trọng cho Flask-Limiter: để app thấy đúng IP thật của khách
        # thay vì IP của Nginx (xem ghi chú trong web.py phần get_remote_address)
        proxy_redirect off;
    }
}
