    <!--   MODAL HỘP THOẠI XÁC NHẬN SANG TRỌNG (CUSTOM CONFIRM)  -->

    <div id="appConfirmModal" class="app-confirm-overlay" aria-hidden="true">
        <div class="app-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="appConfirmTitle">
            <div class="app-confirm-icon-wrap icon-warning" id="appConfirmIconWrap">
                <svg id="appConfirmIcon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
            <div class="app-confirm-content">

                <p class="app-confirm-message" id="appConfirmMessage">Bạn có muốn làm mới cuộc trò chuyện này không?</p>
            </div>
            <div class="app-confirm-actions">
                <button type="button" class="app-confirm-btn app-confirm-btn-cancel"
                    id="appConfirmCancelBtn">Hủy</button>
                <button type="button" class="app-confirm-btn app-confirm-btn-ok" id="appConfirmOkBtn">Xác nhận</button>
            </div>
        </div>
    </div>
