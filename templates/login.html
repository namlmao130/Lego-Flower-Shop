{% extends "base.html" %}
{% block title %}Đăng nhập - Lego Flower{% endblock %}

{% block content %}
<div class="row justify-content-center my-3 my-md-4">
    <div class="col-11 col-sm-9 col-md-6 col-lg-5 col-xl-4">
        <div class="auth-card p-4 p-md-5 rounded-4 shadow-sm">
            <div class="text-center mb-4">
                <h3 class="fw-bold mb-1" style="font-family:'Playfair Display',serif; color:#21243D; letter-spacing: -0.3px;">Đăng nhập</h3>
                <p class="text-muted small mb-0">Chào mừng bạn quay lại với Lego Flower</p>
            </div>

            <form method="POST" id="loginForm">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary mb-1">Số điện thoại</label>
                    <input type="tel" name="phone" id="loginPhone" class="form-control" placeholder="0912345678"
                           inputmode="numeric" autocomplete="tel" maxlength="15"
                           value="{{ phone or '' }}" required {% if not phone %}autofocus{% endif %}>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary mb-1">Mật khẩu</label>
                    <div class="input-group">
                        <input type="password" name="password" id="loginPassword" class="form-control"
                               placeholder="Nhập mật khẩu" required autocomplete="current-password"
                               {% if phone %}autofocus{% endif %}>
                        <button class="btn btn-outline-secondary toggle-password-btn" type="button"
                                data-target="loginPassword" title="Hiện/ẩn mật khẩu" aria-label="Hiện/ẩn mật khẩu">
                            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13.1 13.1 0 0 0 1.66 2.043C4.12 11.332 5.88 12.5 8 12.5s3.879-1.168 5.168-2.457A13.1 13.1 0 0 0 14.828 8q-.086-.13-.195-.288c-.335-.48-.83-1.12-1.465-1.755C11.879 4.668 10.119 3.5 8 3.5s-3.879 1.168-5.168 2.457A13.1 13.1 0 0 0 1.172 8z"/>
                                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                            </svg>
                            <svg class="eye-closed d-none" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474L2.09 4.213C.953 5.378 0 6.8 0 8s3 5.5 8 5.5c1.026 0 1.98-.24 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.07-2.07a3.5 3.5 0 0 0-4.474-4.474z"/>
                                <path d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6L2.293 2.293l.707-.707 11.354 11.354z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" name="remember" id="rememberMe" checked>
                        <label class="form-check-label small user-select-none" for="rememberMe" style="color: #55596e; cursor: pointer;">
                            Ghi nhớ đăng nhập
                        </label>
                    </div>
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn btn-auth w-100 py-2 fw-semibold">
                    <span class="btn-text">Đăng nhập</span>
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top" style="border-color: rgba(33, 36, 61, 0.08) !important;">
                <p class="small text-muted mb-0">
                    Chưa có tài khoản? <a href="{{ url_for('register') }}" class="auth-switch-link">Đăng ký ngay</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Nút ẩn/hiện mật khẩu (SVG)
    document.querySelectorAll('.toggle-password-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var targetId = this.getAttribute('data-target');
            var input = document.getElementById(targetId);
            if (input) {
                var isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                var openIcon = this.querySelector('.eye-open');
                var closedIcon = this.querySelector('.eye-closed');
                if (openIcon && closedIcon) {
                    if (isPassword) {
                        openIcon.classList.add('d-none');
                        closedIcon.classList.remove('d-none');
                    } else {
                        openIcon.classList.remove('d-none');
                        closedIcon.classList.add('d-none');
                    }
                }
                input.focus();
            }
        });
    });

    // Tự động làm sạch số điện thoại khi gõ/dán
    var phoneInput = document.getElementById('loginPhone');
    if (phoneInput) {
        phoneInput.addEventListener('input', function() {
            var val = this.value;
            if (val.startsWith('+')) {
                this.value = '+' + val.slice(1).replace(/\D/g, '');
            } else {
                this.value = val.replace(/\D/g, '');
            }
        });
    }

    // Hiệu ứng loading nút và chống click lặp
    var form = document.getElementById('loginForm');
    if (form) {
        form.addEventListener('submit', function() {
            var btn = document.getElementById('loginSubmitBtn');
            if (btn && !btn.disabled) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Đang đăng nhập...';
                form.submit();
            }
        });
    }
});
</script>
{% endblock %}
