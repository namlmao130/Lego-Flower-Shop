{% extends "base.html" %}
{% block title %}Đăng nhập - Lego Flower{% endblock %}

{% block content %}
<div class="row justify-content-center my-3 my-md-4">
    <div class="col-11 col-sm-9 col-md-6 col-lg-5 col-xl-4">
        <div class="auth-card p-4 p-md-5 rounded-4 shadow-lg">
            <div class="text-center mb-4">
                <div class="auth-icon mb-2">🥀</div>
                <h3 class="fw-bold mb-1" style="font-family:'Playfair Display',serif; color:#21243D;">Đăng nhập</h3>
                <p class="text-muted small mb-0">Chào mừng bạn quay lại với Lego Flower</p>
            </div>

            <form method="POST" id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-bold small text-dark d-flex align-items-center gap-1">
                        <span>📱</span> Số điện thoại
                    </label>
                    <input type="tel" name="phone" id="loginPhone" class="form-control" placeholder="0912345678"
                           inputmode="numeric" autocomplete="tel" maxlength="15"
                           value="{{ phone or '' }}" required {% if not phone %}autofocus{% endif %}>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-dark d-flex align-items-center gap-1">
                        <span>🔒</span> Mật khẩu
                    </label>
                    <div class="input-group">
                        <input type="password" name="password" id="loginPassword" class="form-control"
                               placeholder="••••••••" required autocomplete="current-password"
                               {% if phone %}autofocus{% endif %}>
                        <button class="btn btn-outline-secondary toggle-password-btn" type="button"
                                data-target="loginPassword" title="Hiện/ẩn mật khẩu" aria-label="Hiện/ẩn mật khẩu">
                            <span class="eye-icon">👁️</span>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" name="remember" id="rememberMe" checked>
                        <label class="form-check-label small user-select-none" for="rememberMe" style="color: #4A4E69; cursor: pointer;">
                            Ghi nhớ đăng nhập
                        </label>
                    </div>
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn btn-auth w-100 py-2 fw-bold shadow-sm">
                    <span class="btn-text">Đăng nhập</span>
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top" style="border-color: rgba(33, 36, 61, 0.1) !important;">
                <p class="small text-muted mb-0">
                    Chưa có tài khoản? <a href="{{ url_for('register') }}" class="auth-switch-link">Đăng ký ngay</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Nút ẩn/hiện mật khẩu
    document.querySelectorAll('.toggle-password-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var targetId = this.getAttribute('data-target');
            var input = document.getElementById(targetId);
            if (input) {
                var isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                var eye = this.querySelector('.eye-icon');
                if (eye) eye.textContent = isPassword ? '🙈' : '👁️';
                input.focus();
            }
        });
    });

    // Tự động chuẩn hóa số điện thoại khi gõ/dán (chỉ giữ số và dấu +)
    var phoneInput = document.getElementById('loginPhone');
    if (phoneInput) {
        phoneInput.addEventListener('input', function() {
            var val = this.value;
            if (val.startsWith('+')) {
                this.value = '+' + val.slice(1).replace(/\D/g, '');
            } else {
                this.value = val.replace(/\D/g, '');
            }
        });
    }

    // Hiệu ứng loading nút và chống click lặp
    var form = document.getElementById('loginForm');
    if (form) {
        form.addEventListener('submit', function() {
            var btn = document.getElementById('loginSubmitBtn');
            if (btn && !btn.disabled) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Đang đăng nhập...';
                form.submit();
            }
        });
    }
});
</script>
{% endblock %}
