<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#172033">
    <title>Đăng nhập quản trị | Lego Flower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet">
</head>
<body class="admin-login-body">
    <main class="admin-login-card">
        <div class="admin-login-logo">
            <span class="admin-brand-mark" aria-hidden="true">LF</span>
            <h1>Đăng nhập quản trị</h1>
            <p>Quản lý cửa hàng Lego Flower</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="alert alert-danger admin-alert" role="alert">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
        <form method="POST">
            <div class="mb-3"><label for="username" class="form-label fw-semibold">Tên đăng nhập</label><input id="username" type="text" name="username" class="form-control form-control-lg" autocomplete="username" required autofocus></div>
            <div class="mb-4"><label for="password" class="form-label fw-semibold">Mật khẩu</label><input id="password" type="password" name="password" class="form-control form-control-lg" autocomplete="current-password" required></div>
            <button type="submit" class="btn btn-admin-primary btn-lg w-100">Đăng nhập</button>
        </form>
        <a href="{{ url_for('index') }}" class="d-block text-center mt-4 small text-secondary text-decoration-none">← Quay về cửa hàng</a>
    </main>
</body>
</html>
